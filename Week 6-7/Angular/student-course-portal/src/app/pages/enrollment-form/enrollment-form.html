<h2>Student Enrollment Form</h2>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

  <label>Student Name:</label><br>
  <input
  type="text"
  name="studentName"
  [(ngModel)]="studentName"
  required
  minlength="3"
  #nameCtrl="ngModel">

  <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']"
      style="color: red;">
  Name is required
</span>

<span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']"
      style="color: red;">
  Name must be at least 3 characters
</span>
  <br><br>

  <label>Email:</label><br>
  <input
  type="email"
  name="studentEmail"
  [(ngModel)]="studentEmail"
  required
  email
  #emailCtrl="ngModel">
  <br><br>

  <label>Course ID:</label><br>
  <input
  type="number"
  name="courseId"
  [(ngModel)]="courseId"
  required
  #courseCtrl="ngModel">
  <br><br>

  <label>Preferred Semester:</label><br>
  <select
    name="preferredSemester"
    [(ngModel)]="preferredSemester">

    <option value="">Select</option>
    <option value="Odd">Odd</option>
    <option value="Even">Even</option>

  </select>

  <br><br>

  <label>
    <input
  type="checkbox"
  name="agreeToTerms"
  [(ngModel)]="agreeToTerms"
  required
  #termsCtrl="ngModel">
    I agree to the terms
  </label>

  <br><br>

  <button
  type="submit"
  [disabled]="enrollForm.invalid">
  Submit
</button>
<button
  type="button"
  (click)="resetForm(enrollForm)">
  Reset
</button>

</form>
<div *ngIf="submitted" style="color: green; margin-top: 15px;">
  ✅ Enrollment request submitted successfully!
</div>
