<h2>Available Courses</h2>
<p *ngIf="isLoading">Loading courses...</p>
<button (click)="toggleCourses()">
  {{ showCourses ? 'Hide Courses' : 'Show Courses' }}
</button>

<br><br>

<label>Search Course:</label>

<input
  type="text"
  [(ngModel)]="searchText"
  (ngModelChange)="updateSearch()"
  placeholder="Enter course name">

<p>You typed: <strong>{{ searchText }}</strong></p>

<hr>

<p><strong>Selected Course:</strong> {{ selectedCourse }}</p>

<div *ngIf="!isLoading && showCourses">

  <div *ngIf="courses.length > 0; else noCourses">

    <div
  *ngFor="let c of courses; let i = index; trackBy: trackByCourseId"
  (click)="viewCourse(c.id)"
  style="cursor: pointer;">

  <app-course-card
    [course]="c"
    (enrollRequested)="onEnroll($event)">
  </app-course-card>

</div>

  </div>

  <ng-template #noCourses>
    <p>No courses available.</p>
  </ng-template>

</div>
<p *ngIf="selectedCourseId">
  Selected Course ID: {{ selectedCourseId }}
</p>
