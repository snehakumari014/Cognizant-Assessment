<h1>{{ portalName }}</h1>

<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>
<label>Search Course:</label>

<input
  type="text"
  [(ngModel)]="searchTerm"
  placeholder="Enter course name">

<p>Searching for: {{ searchTerm }}</p>

<p>Welcome to the Student Course Portal.</p>

<p>Courses Available: 12</p>
<p>Enrolled: 3</p>
<p>GPA: 3.8</p>
