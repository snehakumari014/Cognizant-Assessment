<h2>Student Profile</h2>

<h3>Enrolled Courses</h3>

<ul *ngIf="enrollmentService.getEnrolledCourses().length > 0; else noCourses">

  <li *ngFor="let course of enrollmentService.getEnrolledCourses()">

    <strong>{{ course.name }}</strong><br>

    Code: {{ course.code }}<br>

    Credits: {{ course.credits }}

  </li>

</ul>

<ng-template #noCourses>

  <p>No courses enrolled yet.</p>

</ng-template>
